  <rect x="167" y="100" width="61" height="28" fill="url(#wallL)"/>
  <rect x="166" y="99" width="63" height="2" fill="#FFFFFF"/>
  <!-- 경사 지붕: 왼쪽 낮고 오른쪽 높음 -->
  <path fill="url(#roofL)" d="M166 100 L249 64 L252 64 L252 100 Z"/>
  <path fill="#A4E0CA" d="M166 100 L249 64 L250.5 65.5 L168 101.5 Z"/>
  <!-- 창 (위 줄) -->
  <use href="#win" x="177" y="108" width="6" height="11"/>
  <use href="#win" x="191" y="108" width="6" height="11"/>
  <use href="#win" x="204" y="108" width="7" height="11"/>
  <use href="#win" x="218" y="108" width="6" height="11"/>
