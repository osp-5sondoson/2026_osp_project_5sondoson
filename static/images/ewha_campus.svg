<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 128" width="2048" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9F3FD"/><stop offset="1" stop-color="#E2F1FE"/>
    </linearGradient>
    <linearGradient id="mt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BDE5EB"/><stop offset="1" stop-color="#A9DCE2"/>
    </linearGradient>
    <linearGradient id="mtNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4E8EC"/><stop offset="1" stop-color="#B2E1E5"/>
    </linearGradient>
    <linearGradient id="roofT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8EDCC0"/><stop offset="1" stop-color="#6FCFAF"/>
    </linearGradient>
    <linearGradient id="roofL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ECDAE"/><stop offset="1" stop-color="#8ED9BC"/>
    </linearGradient>
    <linearGradient id="roofR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86D8BA"/><stop offset="1" stop-color="#9FD0BC"/>
    </linearGradient>
    <linearGradient id="wallT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6FBF6"/><stop offset="0.55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF0EE"/>
    </linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F1EE"/><stop offset="1" stop-color="#FBF8F5"/>
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F8F6"/><stop offset="1" stop-color="#E6E7E6"/>
    </linearGradient>
    <linearGradient id="winT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8BD0C6"/><stop offset="1" stop-color="#5FB9B0"/>
    </linearGradient>
    <linearGradient id="winW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93D8CA"/><stop offset="1" stop-color="#63BEB4"/>
    </linearGradient>
    <radialGradient id="treeD" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#6ED6A4"/><stop offset="1" stop-color="#4CC48E"/>
    </radialGradient>
    <radialGradient id="treeM" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#5BCB92"/><stop offset="1" stop-color="#3EB97F"/>
    </radialGradient>
    <radialGradient id="treeL" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#7AD7A4"/><stop offset="1" stop-color="#62CD93"/>
    </radialGradient>
    <!-- 아치 창: 폭 1, 높이 2 기준 -->
    <symbol id="win" viewBox="0 0 6 12" preserveAspectRatio="none">
      <path d="M0 3 A3 3 0 0 1 6 3 V12 H0 Z" fill="url(#winW)"/>
      <path d="M0.9 3.1 A2.1 2.1 0 0 1 5.1 3.1 V11.2 H0.9 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.5"/>
    </symbol>
    <symbol id="winTall" viewBox="0 0 6 14" preserveAspectRatio="none">
      <path d="M0 3 A3 3 0 0 1 6 3 V14 H0 Z" fill="url(#winT)"/>
      <path d="M0.9 3.1 A2.1 2.1 0 0 1 5.1 3.1 V13.2 H0.9 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.5"/>
    </symbol>
  </defs>

  <rect width="512" height="128" fill="url(#sky)"/>

  <!-- 구름 -->
  <g fill="#FCFDFF">
