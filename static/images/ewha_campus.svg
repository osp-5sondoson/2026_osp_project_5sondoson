  <use href="#win" x="235" y="107" width="5" height="10"/>
  <use href="#win" x="246" y="107" width="5" height="10"/>
  <use href="#win" x="261" y="107" width="5" height="10"/>
  <use href="#win" x="272" y="107" width="5" height="10"/>
  <!-- 바닥 잘린 줄 -->
  <use href="#win" x="235" y="125" width="5" height="10"/>
  <use href="#win" x="246" y="125" width="5" height="10"/>
  <use href="#win" x="261" y="125" width="5" height="10"/>
  <use href="#win" x="272" y="125" width="5" height="10"/>
  <rect x="229" y="102" width="55" height="0.8" fill="#E3E7E4"/>
  <rect x="229" y="121" width="55" height="0.8" fill="#E3E7E4"/>

