  <use href="#winTall" x="299" y="60" width="6" height="14"/>
  <use href="#winTall" x="299" y="81" width="6" height="15"/>
  <use href="#winTall" x="299" y="102" width="6" height="15"/>
  <!-- 바닥 잘린 창 -->
  <use href="#winTall" x="299" y="124" width="6" height="14"/>
  <!-- 모서리 음영 -->
  <rect x="286" y="44" width="2" height="84" fill="#FFFFFF" opacity="0.8"/>
  <rect x="319" y="44" width="3" height="84" fill="#E4E6E3" opacity="0.8"/>
