  <use href="#win" x="235" y="94" width="5" height="6"/>
  <use href="#win" x="246" y="94" width="5" height="6"/>
  <use href="#win" x="261" y="94" width="5" height="6"/>
  <use href="#win" x="272" y="94" width="5" height="6"/>
