    <circle cx="104" cy="36" r="16"/>
    <circle cx="80" cy="44" r="10"/>
    <circle cx="126" cy="43" r="9"/>
    <circle cx="140" cy="48" r="6"/>
    <circle cx="66" cy="48" r="6"/>
    <rect x="57" y="46" width="91" height="6" rx="3"/>
    <!-- 오른쪽 구름 (x390~468, y4~33) -->
    <circle cx="426" cy="17" r="13"/>
    <circle cx="405" cy="26" r="8"/>
    <circle cx="449" cy="24" r="8"/>
    <circle cx="462" cy="29" r="5"/>
    <circle cx="395" cy="29" r="4"/>
    <rect x="391" y="27" width="77" height="6" rx="3"/>
    <!-- 오른쪽 위 구석 작은 구름 -->
    <circle cx="507" cy="2" r="6"/>
  </g>

  <!-- 먼 산 (오른쪽 큰 산 + 가운데) -->
  <path fill="url(#mt)" d="M300 128 V90 C318 84 334 76 353 75 C372 66 393 58 414 55 C432 56 452 70 470 80 C488 90 500 96 512 92 V128 Z"/>
  <!-- 먼 산 (왼쪽) -->
  <path fill="url(#mt)" d="M0 128 V104 C14 100 36 92 55 90 C72 88 90 104 108 113 C124 110 136 100 150 97 C162 95 172 100 180 104 V128 Z"/>
  <!-- 가까운 완만한 언덕 (왼쪽) -->
  <path fill="url(#mtNear)" d="M0 128 V112 C30 104 60 118 95 120 C125 122 150 112 180 114 V128 Z"/>
  <!-- 오른쪽 앞 언덕 -->
  <path fill="url(#mtNear)" d="M396 128 V110 C420 104 450 112 512 106 V128 Z"/>

  <!-- 왼쪽 날개 뒤 초록 언덕 (불룩한 능선, x180~245, y74~100) -->
  <path fill="#8FDBC1" d="M172 104 C178 94 186 84 196 78 C202 74 208 73 214 76 C219 79 223 84 229 82 C234 80 240 79 246 82 L246 104 Z"/>
  <path fill="none" stroke="#BFECDC" stroke-width="1.2" stroke-linecap="round" d="M174 102 C180 93 187 85 196 78.5 C202 74.5 208 73.5 214 76.5 C219 79.5 223 84 229 82.5 C234 80.5 240 79.5 246 82.5"/>
  <path fill="#7CD2B4" opacity="0.5" d="M196 78 C202 74 208 73 214 76 C219 79 223 84 229 82 L229 92 C220 92 210 90 196 92 Z"/>

