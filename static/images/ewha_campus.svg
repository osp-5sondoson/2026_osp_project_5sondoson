  <rect x="367" y="88" width="5" height="5" fill="#CFE0E3"/>
  <use href="#win" x="334" y="107" width="6" height="12"/>
  <use href="#win" x="349" y="108" width="6" height="11"/>
  <use href="#win" x="362" y="109" width="7" height="10"/>
  <use href="#win" x="377" y="109" width="7" height="10"/>
  <use href="#win" x="334" y="126" width="6" height="12"/>
  <use href="#win" x="349" y="126" width="6" height="11"/>
  <use href="#win" x="362" y="126" width="7" height="10"/>
  <use href="#win" x="377" y="126" width="7" height="10"/>
  <rect x="323" y="121" width="72" height="0.8" fill="#DDE0DE"/>

