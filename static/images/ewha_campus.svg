  <use href="#win" x="177" y="125" width="6" height="11"/>
  <use href="#win" x="191" y="125" width="6" height="11"/>
  <use href="#win" x="204" y="125" width="7" height="11"/>
  <use href="#win" x="218" y="125" width="6" height="11"/>
  <rect x="168" y="100" width="37" height="1" fill="#D9E3E0" opacity="0.6"/>
  <rect x="168" y="121" width="60" height="0.8" fill="#E3E7E4"/>

