  <use href="#win" x="291" y="47" width="3.5" height="6"/>
  <use href="#win" x="300" y="47" width="3.5" height="6"/>
  <use href="#win" x="309" y="47" width="3.5" height="6"/>
  <!-- 띠 -->
  <rect x="287" y="56" width="34" height="0.8" fill="#E6E8E6"/>
