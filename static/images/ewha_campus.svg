  <circle cx="162" cy="126" r="8" fill="url(#treeD)"/>
  <circle cx="139" cy="128" r="6" fill="url(#treeM)"/>
  <!-- 바닥 왼쪽 구석 작은 덤불 -->
  <circle cx="22" cy="130" r="8" fill="url(#treeL)"/>
  <!-- 오른쪽 큰 나무 무리 (x429~512, y80~128) -->
  <circle cx="486" cy="104" r="26" fill="url(#treeD)"/>
  <circle cx="453" cy="111" r="20" fill="url(#treeD)"/>
  <circle cx="443" cy="124" r="13" fill="url(#treeM)"/>
  <circle cx="489" cy="123" r="15" fill="url(#treeM)"/>
  <circle cx="505" cy="118" r="12" fill="url(#treeL)"/>
  <circle cx="470" cy="125" r="11" fill="url(#treeD)"/>
