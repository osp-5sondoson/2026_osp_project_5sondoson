{% extends "index.html" %}
{% block section %}
<h1>로그인</h1>
<p class="desc">기쁘띠콘 계정으로 로그인해 주세요.</p>
<form class="form form--narrow" action="/login_confirm" method="post">
 <div class="form__field">
  <label for="id">아이디 *</label>
  <input type="text" name="id" id="id" placeholder="아이디" required>
 </div>
 <div class="form__field">
  <label for="pw">비밀번호 *</label>
  <input type="password" name="pw" id="pw" placeholder="비밀번호" required>
 </div>
 <div class="form__actions">
  <input class="button" type="submit" value="로그인">
 </div>
 <p class="form__switch">아직 회원이 아니신가요? <a href="/signup">회원가입</a></p>
</form>
{% endblock section %}
