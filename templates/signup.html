{% extends "index.html" %}
{% block section %}
{% set f = form or {} %}
{% if error %}<script>alert({{ error|tojson }})</script>{% endif %}
<h1>회원가입</h1>
<p class="desc">기쁘띠콘에서 기프티콘을 사고팔려면 가입해 주세요.</p>
<form class="form form--narrow" action="/signup_post" method="post">
 <div class="form__field">
  <label for="id">아이디 *</label>
  <input type="text" name="id" id="id" value="{{ f.get('id', '') }}" placeholder="영문, 숫자 4~20자" pattern="[A-Za-z0-9]{4,20}" title="영문과 숫자 4~20자" autocomplete="username" required>
 </div>
 <div class="form__field">
  <label for="pw">비밀번호 *</label>
  <input type="password" name="pw" id="pw" placeholder="4자 이상" minlength="4" autocomplete="new-password" required>
 </div>
 <div class="form__field">
  <label for="nickname">닉네임 *</label>
  <input type="text" name="nickname" id="nickname" value="{{ f.get('nickname', '') }}" placeholder="예) 5sondoson" required>
 </div>
 <div class="form__actions">
  <a class="button button--outline" href="/login">취소</a>
  <input class="button" type="submit" value="가입하기">
 </div>
 <p class="form__switch">이미 회원이신가요? <a href="/login">로그인</a></p>
</form>
{% endblock section %}
