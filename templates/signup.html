{% extends "index.html" %}
{% block section %}
{% if error %}
<script>alert("{{ error }}")</script>
{% endif %}
<h1>회원가입</h1>
<p class="desc">기쁘띠콘에서 기프티콘을 사고팔려면 가입해 주세요.</p>
<form class="form form--narrow" action="/signup_post" method="post">
 <div class="form__field">
  <label for="id">아이디 *</label>
  <input type="text" name="id" id="id" placeholder="영문, 숫자" required>
 </div>
 <div class="form__field">
  <label for="pw">비밀번호 *</label>
  <input type="password" name="pw" id="pw" placeholder="비밀번호" required>
 </div>
 <div class="form__field">
  <label for="nickname">닉네임 *</label>
  <input type="text" name="nickname" id="nickname" placeholder="예) 5sondoson" required>
 </div>
 <div class="form__actions">
  <a class="button button--outline" href="/login">취소</a>
  <input class="button" type="submit" value="가입하기">
 </div>
 <p class="form__switch">이미 회원이신가요? <a href="/login">로그인</a></p>
</form>
{% endblock section %}
